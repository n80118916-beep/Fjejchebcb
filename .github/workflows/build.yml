name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Download Forge
      run: |
        wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-src.zip -O mdk.zip
        unzip -q mdk.zip
        mv forge-1.7.10-10.13.4.1614-1.7.10-src mdk
        
    - name: Fix Files and Build
      run: |
        cd mod/com/example/helpermod
        for f in *; do mv "$f" "$f.java" 2>/dev/null || true; done
        cd ../../..
        
        mkdir -p mdk/src/main/resources
        cp -r com mdk/src/main/java/
        cp mcmod.info mdk/src/main/resources/
        cp -r assets mdk/src/main/resources/
        
        cd mdk
        chmod +x gradlew
        ./gradlew setupDecompWorkspace --no-daemon
        ./gradlew build --no-daemon
        
    - name: Upload Jar
      uses: actions/upload-artifact@v4
      with:
        name: helpermod-jar
        path: mdk/build/libs/*.jar
