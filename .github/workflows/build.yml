name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Forge MDK 1.7.10
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-src.zip -O mdk.zip
          unzip -q mdk.zip
          mv forge-1.7.10-10.13.4.1614-1.7.10-src mdk

      - name: Copy mod files into MDK
        run: |
          mkdir -p mdk/src/main/java/com/example/helpermod
          mkdir -p mdk/src/main/resources
          cp -r mod/com/example/helpermod/*.java mdk/src/main/java/com/example/helpermod/
          cp mod/mcmod.info mdk/src/main/resources/
          cp -r mod/assets mdk/src/main/resources/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v1

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew setupDecompWorkspace --no-daemon -Dorg.gradle.jvmargs=-Xmx3G
          ./gradlew build --no-daemon -Dorg.gradle.jvmargs=-Xmx3G

      - uses: actions/upload-artifact@v4
        with:
          name: helpermod-jar
          path: mdk/build/libs/*.jar
